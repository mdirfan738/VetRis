
name: Backend Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vetris-dev-backend
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY }}
  CONTAINER_NAME: backend

jobs:
  build-and-deploy:
    name: Build, Push, Migrate, Deploy, Smoke Test
    runs-on: ubuntu-latest
    environment: dev-backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REPOSITORY:latest" .

      - name: Tag and push Docker image
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag "$ECR_REPOSITORY:${{ github.sha }}" \
            "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          docker tag "$ECR_REPOSITORY:latest" \
            "$REGISTRY/$ECR_REPOSITORY:latest"

          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

          echo "image=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        working-directory: backend
        env:
          VETRIS_DB_CONNECTION: ${{ secrets.VETRIS_DB_CONNECTION }}
        run: |
          docker run --rm \
            -e VETRIS_DB_CONNECTION \
            -v "$PWD":/src \
            -w /src/VetRIS.Api \
            mcr.microsoft.com/dotnet/sdk:8.0 \
            bash -c '
              dotnet tool install --global dotnet-ef &&
              export PATH="$PATH:/root/.dotnet/tools" &&
              dotnet ef database update \
                --project ../VetRIS.Infrastructure \
                --startup-project .
            '

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test API health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent --show-error \
              "https://api.alua2kg.online/api/health"; then
              echo "Smoke test passed."
              exit 0
            fi

            echo "Attempt $i failed. Retrying in 6 seconds..."
            sleep 6
          done

          echo "::error::Smoke test failed: API health endpoint did not return HTTP 200."
          exit 1