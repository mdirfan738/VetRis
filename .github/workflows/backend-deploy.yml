name: Backend Deploy

# Deploys to ECS Fargate + an Application Load Balancer.
#
# Diff from the previous version of this workflow: build/push steps are
# unchanged (same ECR repo, same Dockerfile location); "trigger deployment"
# is replaced with registering a new ECS task definition revision (pointing
# at the new image) and updating the service to use it, then waiting for
# the service — not just the deploy call — to report stable. Also added: a
# database migration step (the previous workflow never had one) and a
# smoke test against the real domain.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vetris-dev-backend
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY }}
  CONTAINER_NAME: backend

jobs:
  build-and-deploy:
    name: Build, Push, Migrate, Deploy, Smoke Test
    runs-on: ubuntu-latest
    environment: dev-backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: backend
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} -t $ECR_REPOSITORY:latest .

      - name: Tag & push image
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag $ECR_REPOSITORY:${{ github.sha }} $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker tag $ECR_REPOSITORY:latest $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        # Needs network access to RDS — see docker/TERRAFORM-GAPS.md's
        # network note if this job can't reach it directly (private-subnet
        # RDS typically needs a VPC-connected runner or a tunnel).
        working-directory: backend
        env:
          VETRIS_DB_CONNECTION: ${{ secrets.VETRIS_DB_CONNECTION }}
        run: |
          docker run --rm \
            -e VETRIS_DB_CONNECTION \
            -v "$PWD":/src -w /src/VetRIS.Api \
            mcr.microsoft.com/dotnet/sdk:8.0 \
            bash -c "dotnet tool install --global dotnet-ef && \
                     export PATH=\"\$PATH:/root/.dotnet/tools\" && \
                     dotnet ef database update --project ../VetRIS.Infrastructure --startup-project ."

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with the freshly pushed image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image }}

      - name: Deploy to ECS (register new revision, update service, wait for stable)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://api.alua2kg.online/api/health"; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Smoke test failed — /api/health never returned 200 after deploy." >&2
          exit 1
